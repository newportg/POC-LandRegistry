name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - Readme.md
      - Wiki/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Prepare docs source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf docs-src
          mkdir -p docs-src

          # Use repository README as homepage.
          cp Readme.md docs-src/index.md

          # Copy wiki markdown content.
          if [ -d Wiki ]; then
            cp -R Wiki docs-src/wiki
          fi

          printf '%s\n' \
            'site_name: Knight Frank Hub Land Registry' \
            'docs_dir: docs-src' \
            'site_dir: site' \
            'theme:' \
            '  name: material' \
            'markdown_extensions:' \
            '  - toc:' \
            '      permalink: true' \
            > mkdocs.yml

      - name: Build documentation site
        run: mkdocs build --strict

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
