name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - Readme.md
      - Wiki/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Prepare docs source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf docs-src
          mkdir -p docs-src

          # Use repository README as homepage.
          cp Readme.md docs-src/index.md

          # Copy wiki markdown content.
          if [ -d Wiki ]; then
            cp -R Wiki docs-src/wiki
          fi

          # Make legacy hidden attachments render in MkDocs by exposing them as
          # non-hidden "attachments" and normalizing markdown link targets.
          if [ -d docs-src/wiki/.attachments ]; then
            cp -R docs-src/wiki/.attachments docs-src/wiki/attachments
            ln -s "$PWD/docs-src/wiki/attachments" docs-src/attachments

            # Many pages reference .attachments as if it exists beside each file.
            # Create per-folder symlinks to a single attachments directory.
            while IFS= read -r -d '' mdfile; do
              mddir="$(dirname "$mdfile")"
              if [ "$mddir" != "docs-src/wiki" ] && [ ! -e "$mddir/attachments" ]; then
                ln -s "$PWD/docs-src/wiki/attachments" "$mddir/attachments"
              fi
            done < <(find docs-src/wiki -type f -name '*.md' -print0)

            # Rewrite legacy attachment links and strip "=750x" style suffixes.
            while IFS= read -r -d '' mdfile; do
              sed -E -i \
                -e 's#\(/Wiki/\.attachments/#(attachments/#g' \
                -e 's#\(/wiki/\.attachments/#(attachments/#g' \
                -e 's#\(wiki/\.attachments/#(attachments/#g' \
                -e 's#\(/\.attachments/#(attachments/#g' \
                -e 's#\(\.attachments/#(attachments/#g' \
                -e 's#\(([^)]*\.(png|jpg|jpeg|gif|svg|webp))\s+=([0-9]+x[0-9]*)\)#(\1)#Ig' \
                "$mdfile"
            done < <(find docs-src -type f -name '*.md' -print0)
          fi

          printf '%s\n' \
            'site_name: Knight Frank Hub Land Registry' \
            'docs_dir: docs-src' \
            'site_dir: site' \
            'theme:' \
            '  name: material' \
            'nav:' \
            '  - Home: index.md' \
            '  - Wiki:' \
            '      - Introduction and Goals: wiki/1-introduction-and-goals.md' \
            '      - Architectural Constraints: wiki/2-architectural-constraints.md' \
            '      - System Scope and Context: wiki/3-system-scope-and-context.md' \
            '      - Solution Strategy: wiki/4-solution-strategy.md' \
            '      - Building Block View:' \
            '          - Overview: wiki/5-building-block-view.md' \
            '          - Azure Function Detail: wiki/5-building-block-view/azure-function-detail.md' \
            '          - Cosmos DB Component: wiki/5-building-block-view/cosmos-db-component.md' \
            '          - Domain Logic Component: wiki/5-building-block-view/domain-logic-component.md' \
            '          - Land Registry Service Handler: wiki/5-building-block-view/landregistry-service-handler.md' \
            '          - Nimbus Service Handler: wiki/5-building-block-view/nimbus-service-handler.md' \
            '          - Security Component: wiki/5-building-block-view/security-component.md' \
            '      - Runtime View: wiki/6-runtime-view.md' \
            '      - Deployment View: wiki/7-deployment-view.md' \
            '      - Land Registry: wiki/LandRegistry.md' \
            '      - Service: wiki/Service.md' \
            'markdown_extensions:' \
            '  - toc:' \
            '      permalink: true' \
            > mkdocs.yml

      - name: Build documentation site
        run: mkdocs build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
